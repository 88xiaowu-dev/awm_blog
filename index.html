<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWM - Portal Informasi</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        /* =========================================
           BODY / BACKGROUND
        ========================================= */

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            color: #ffffff;

            background:
                linear-gradient(
                    rgba(0, 5, 25, 0.72),
                    rgba(0, 12, 35, 0.25)
                ),
                url("https://raw.githubusercontent.com/88xiaowu-dev/awm/main/Bg_awm.png")
                no-repeat center center fixed;

            background-size: cover;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            overflow-x: hidden;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            padding: 30px 15px 0;

            text-align: center;
        }


        .brand-container {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        /* =========================================
           LOGO
        ========================================= */

        .site-logo {
            width: 100px;

            height: 100px;

            object-fit: contain;

            display: block;

            border-radius: 22px;
        }


        /* =========================================
           NAMA WEBSITE
        ========================================= */

        .site-name-bar {
            width: 100%;

            max-width: 600px;

            margin: 28px auto 0;

            padding: 11px 15px;

            background:
                rgba(252, 52, 2, 0.216);

            border:
                2px solid
                rgba(253, 3, 3, 1);

            border-radius: 10px;

            font-size: 20px;

            font-weight: 700;

            text-align: center;

            box-shadow:
                0 2px 8px
                rgba(255, 253, 253, 1);
        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {
            width: 100%;

            max-width: 630px;

            margin: 32px auto;

            padding: 0 15px;

            flex: 1;
        }


        /* =========================================
           MENU VERTIKAL
        ========================================= */

        .menu-grid {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        /* =========================================
           WRAPPER MENU

           Wrapper menangani efek goyang.
           Tombol menu menangani efek zoom.
        ========================================= */

        .menu-wrapper {
            width: 100%;

            position: relative;

            transform-origin: center center;

            animation:
                goyang
                2.8s
                ease-in-out
                infinite;
        }


        /* =========================================
           TOMBOL MENU
        ========================================= */

        .menu-item {
            width: 100%;

            min-height: 70px;

            display: grid;

            grid-template-columns:
                70px
                1fr
                45px;

            align-items: center;

            padding: 8px 12px;

            background:
                rgba(252, 52, 2, 0.1);

            border:
                2px solid
                rgb(91, 2, 2);

            border-radius: 11px;

            text-decoration: none;

            color: #ffffff;

            font-weight: bold;

            box-shadow:
                0 2px 8px
                rgba(253, 3, 3, 1);

            transform:
                scale(1);

            transform-origin:
                center center;

            transition:
                transform 0.30s ease,
                background 0.30s ease,
                box-shadow 0.30s ease,
                border-color 0.30s ease;
        }


        /* =========================================
           ANIMASI GOYANG
        ========================================= */

        @keyframes goyang {

            0%,
            100% {
                transform:
                    rotate(0deg);
            }

            20% {
                transform:
                    rotate(-0.8deg);
            }

            40% {
                transform:
                    rotate(0.8deg);
            }

            60% {
                transform:
                    rotate(-0.6deg);
            }

            80% {
                transform:
                    rotate(0.6deg);
            }
        }


        /* =========================================
           DELAY BERBEDA

           Supaya tombol tidak bergoyang
           tepat secara bersamaan.
        ========================================= */

        .menu-wrapper:nth-child(1) {
            animation-delay: 0s;
        }

        .menu-wrapper:nth-child(2) {
            animation-delay: 0.15s;
        }

        .menu-wrapper:nth-child(3) {
            animation-delay: 0.30s;
        }

        .menu-wrapper:nth-child(4) {
            animation-delay: 0.45s;
        }

        .menu-wrapper:nth-child(5) {
            animation-delay: 0.60s;
        }

        .menu-wrapper:nth-child(6) {
            animation-delay: 0.75s;
        }

        .menu-wrapper:nth-child(7) {
            animation-delay: 0.90s;
        }

        .menu-wrapper:nth-child(8) {
            animation-delay: 1.05s;
        }


        /* =========================================
           HOVER / ZOOM SELURUH MENU
        ========================================= */

        @media (hover: hover) and (pointer: fine) {

            /*
               Saat kursor masuk ke area menu,
               animasi goyang berhenti sementara.
            */

            .menu-wrapper:hover {
                animation-play-state:
                    paused;

                z-index: 20;
            }


            /*
               Seluruh kotak menu membesar:
               background,
               border,
               icon,
               tulisan,
               dan share icon.
            */

            .menu-wrapper:hover .menu-item {
                transform:
                    translateY(-3px)
                    scale(1.07);

                background:
                    rgb(227, 54, 6);

                border-color:
                    rgb(246, 206, 5);

                box-shadow:
                    0 7px 10px
                    rgba(251, 250, 249, 0.5);
            }
        }


        /* =========================================
           ICON KIRI
        ========================================= */

        .menu-icon {
            width: 55px;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            border-radius: 8px;

            background:
                rgba(251, 2, 2, 0.3);

            overflow: hidden;
        }


        /* =========================================
           JIKA ICON MENGGUNAKAN GAMBAR
        ========================================= */

        .menu-icon img {
            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 8px;
        }


        /* =========================================
           TEKS MENU
        ========================================= */

        .menu-title {
            min-width: 0;

            padding: 0 8px;

            font-size: 17px;

            font-weight: 600;

            text-align: center;

            text-transform: uppercase;

            line-height: 1.3;
        }


        /* =========================================
           ICON SHARE
        ========================================= */

        .share-icon {
            width: 35px;

            height: 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;

            color: #ffffff;
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {
            width: 100%;

            padding: 18px;

            text-align: center;

            font-size: 15px;

            font-weight: bold;

            color:
                rgba(255, 255, 255, 0.85);

            background:
                rgba(246, 4, 4, 0.2);

            border-top:
                1px solid
                rgb(246, 4, 4);
        }


        /* =========================================
           RESPONSIVE HP
        ========================================= */

        @media (max-width: 600px) {

            header {
                padding-top: 22px;
            }

            .site-logo {
                width: 85px;

                height: 85px;
            }

            .site-name-bar {
                margin-top: 22px;

                font-size: 18px;
            }

            .container {
                margin-top: 26px;

                padding: 0 12px;
            }

            .menu-grid {
                gap: 14px;
            }

            .menu-item {
                min-height: 66px;

                grid-template-columns:
                    60px
                    1fr
                    40px;

                padding:
                    7px
                    10px;
            }

            .menu-icon {
                width: 50px;

                height: 50px;

                font-size: 24px;
            }

            .menu-title {
                font-size: 15px;
            }

            .share-icon {
                font-size: 21px;
            }
        }


        /* =========================================
           HP SANGAT KECIL
        ========================================= */

        @media (max-width: 380px) {

            .menu-title {
                font-size: 13px;
            }

            .menu-item {
                grid-template-columns:
                    55px
                    1fr
                    35px;
            }

            .menu-icon {
                width: 46px;

                height: 46px;
            }
        }


        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .menu-wrapper {
                animation: none;
            }

            .menu-item {
                transition: none;
            }
        }

    </style>

</head>
